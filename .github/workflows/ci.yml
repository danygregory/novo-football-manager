name: CI

on:
  push:
    branches: [main]
  pull_request:

# o token do workflow só lê o repositório
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar (versões exatas do package-lock.json)
        run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes (motor, dados, torneio, carreira, pontuação, interface pura)
        run: npm test
      - name: Motor idêntico ao baseline (refatorações não mudam resultados)
        run: npm run golden
      - name: Build de produção (com a CSP)
        run: npm run build
      - name: Auditoria das dependências
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta (build de produção, Copa inteira, partida ao vivo, save adulterado, CSP)
        run: npm run e2e
      - name: Relatório do Playwright (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
